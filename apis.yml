name: LetGo
description: 'letgo is a mobile-first classifieds and secondhand marketplace where individuals list, browse,
  and negotiate on used goods — vehicles, electronics, furniture, and household items — with chat-based
  buyer/seller messaging and location-based discovery. Launched in 2015 and backed by Naspers/OLX, letgo grew
  into one of the largest peer-to-peer resale apps in the United States before combining its US operation with
  OfferUp in 2020. The letgo brand and letgo.com continue to operate as a regional classifieds marketplace; the
  live site currently serves a Turkish-language catalog (category browsing, search, and an otoplus vehicles
  section per its robots.txt). letgo publishes no public developer program, API documentation, or SDKs. The
  application-internal API under /api/ is explicitly disallowed in robots.txt, and the entire site sits behind
  an Akamai bot-mitigation challenge, so no developer surface could be verified.'
